version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    volumes:
      - postgres_data:/var/lib/postgresql@16/data
    ports:
      - 5433:5432
    healthcheck:
      test: ['CMD-SHELL', "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 5
 
volumes:
  postgres_data: